# Use together with the base file:
# docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm patient-api
services:
  patient-api:
    build:
      target: test
    environment:
      NODE_ENV: test
      REQUIRE_MFA: "false"
      RUN_RUNTIME_SCHEMA_SYNC: "false"
    command: ["npm", "test", "--", "--runInBand"]
    ports: []

  web-app:
    build:
      target: test
    environment:
      CI: "true"
    command: ["npm", "test"]
    ports: []
