name: ${COMPOSE_PROJECT_NAME:-medimesh-clinic}

# Production expects approved, TLS-enabled PostgreSQL, Redis and S3-compatible
# services. Terminate public TLS at the facility ingress in front of web-app.
services:
  web-app:
    image: ${MEDIMESH_WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      patient-api:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    networks: [edge, application]
    read_only: true
    tmpfs:
      - /tmp
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:8080/health]
      interval: 30s
      timeout: 5s
      retries: 5

  patient-api:
    image: ${MEDIMESH_API_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_BASE_URL: https://${DOMAIN}
      ALLOWED_ORIGINS: https://${DOMAIN}
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_SSL: "true"
      DATABASE_SSL_REJECT_UNAUTHORIZED: "true"
      DATABASE_SSL_CA_FILE: /run/secrets/database_ca
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_app_user
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_app_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      MFA_ENCRYPTION_KEY_FILE: /run/secrets/mfa_encryption_key
      FILE_ENCRYPTION_KEY_FILE: /run/secrets/file_encryption_key
      REQUIRE_MFA: "true"
      SESSION_TTL_SECONDS: 900
      AUDIT_FAIL_CLOSED: "true"
      DLP_EXPORT_LIMIT: 20
      RUN_RUNTIME_SCHEMA_SYNC: "false"
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      MPESA_ENVIRONMENT: ${MPESA_ENVIRONMENT:-sandbox}
      MPESA_CONSUMER_KEY_FILE: /run/secrets/mpesa_consumer_key
      MPESA_CONSUMER_SECRET_FILE: /run/secrets/mpesa_consumer_secret
      MPESA_PASSKEY_FILE: /run/secrets/mpesa_passkey
      MPESA_SHORTCODE_FILE: /run/secrets/mpesa_shortcode
      MPESA_CALLBACK_TOKEN_FILE: /run/secrets/mpesa_callback_token
      MPESA_CALLBACK_URL: https://${DOMAIN}/api/payments/mpesa/callback
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets:
      - database_url
      - database_ca
      - redis_password
      - minio_app_user
      - minio_app_password
      - jwt_secret
      - mfa_encryption_key
      - file_encryption_key
      - bootstrap_admin_password
      - mpesa_consumer_key
      - mpesa_consumer_secret
      - mpesa_passkey
      - mpesa_shortcode
      - mpesa_callback_token
    depends_on:
      clamav:
        condition: service_healthy
    networks: [application, scanning, egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 200
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://localhost:3000/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  clamav:
    image: ${CLAMAV_IMAGE}
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    networks: [scanning]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1536m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, "echo PING | nc 127.0.0.1 3310 | grep PONG"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 20

networks:
  edge: {}
  application:
    internal: true
  scanning:
    internal: true
  egress: {}

volumes:
  clamav_data: {}

secrets:
  database_url: { file: ./secrets/database_url }
  database_ca: { file: ./secrets/database_ca }
  redis_password: { file: ./secrets/redis_password }
  minio_app_user: { file: ./secrets/minio_app_user }
  minio_app_password: { file: ./secrets/minio_app_password }
  jwt_secret: { file: ./secrets/jwt_secret }
  mfa_encryption_key: { file: ./secrets/mfa_encryption_key }
  file_encryption_key: { file: ./secrets/file_encryption_key }
  bootstrap_admin_password: { file: ./secrets/bootstrap_admin_password }
  mpesa_consumer_key: { file: ./secrets/mpesa_consumer_key }
  mpesa_consumer_secret: { file: ./secrets/mpesa_consumer_secret }
  mpesa_passkey: { file: ./secrets/mpesa_passkey }
  mpesa_shortcode: { file: ./secrets/mpesa_shortcode }
  mpesa_callback_token: { file: ./secrets/mpesa_callback_token }
