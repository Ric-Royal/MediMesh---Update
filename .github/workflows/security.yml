name: Security Scan

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: |
          web-app/package-lock.json
          services/patient-api/package-lock.json
    
    # Frontend Security Scan
    - name: Install frontend dependencies
      run: |
        cd web-app
        npm ci
        
    - name: Run frontend security audit
      run: |
        cd web-app
        npm audit --audit-level=moderate
        
    # Backend Security Scan
    - name: Install backend dependencies
      if: always()
      run: |
        cd services/patient-api
        npm ci
        
    - name: Run backend security audit
      if: always()
      run: |
        cd services/patient-api
        npm audit --audit-level=moderate
        
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
        
    - name: Run TruffleHog OSS
      uses: trufflesecurity/trufflehog@17456f8c7d042d8c82c9a8ca9e937231f9f42e26 # v3.95.2
      with:
        path: ./
        extra_args: --results=verified,unknown

  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Build Docker images
      run: |
        docker build -t medimesh-frontend ./web-app
        docker build -t medimesh-backend ./services/patient-api
        
    - name: Run Trivy vulnerability scanner - Frontend
      id: trivy_frontend
      continue-on-error: true
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: 'medimesh-frontend'
        format: 'sarif'
        output: 'trivy-frontend-results.sarif'
        severity: 'HIGH,CRITICAL'
        limit-severities-for-sarif: true
        exit-code: '1'
        
    - name: Run Trivy vulnerability scanner - Backend
      id: trivy_backend
      continue-on-error: true
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: 'medimesh-backend'
        format: 'sarif'
        output: 'trivy-backend-results.sarif'
        severity: 'HIGH,CRITICAL'
        limit-severities-for-sarif: true
        exit-code: '1'
        
    - name: Retain Trivy scan reports
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: trivy-sarif-reports
        path: |
          trivy-frontend-results.sarif
          trivy-backend-results.sarif
        if-no-files-found: error

    - name: Enforce container vulnerability gate
      if: always() && (steps.trivy_frontend.outcome == 'failure' || steps.trivy_backend.outcome == 'failure')
      run: exit 1

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Initialize CodeQL
      uses: github/codeql-action/init@f25eda876ebb741d872b63b9f2c6dfdd77f14b83 # v4.35.5
      with:
        languages: ${{ matrix.language }}
        
    - name: Autobuild
      uses: github/codeql-action/autobuild@f25eda876ebb741d872b63b9f2c6dfdd77f14b83 # v4.35.5
      
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@f25eda876ebb741d872b63b9f2c6dfdd77f14b83 # v4.35.5
      with:
        upload: false
        output: codeql-results

    - name: Retain CodeQL analysis report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: codeql-sarif-report
        path: codeql-results
        if-no-files-found: error

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
        
    - name: Install license checker
      run: npm install -g license-checker@25.0.1
      
    - name: Check frontend licenses
      run: |
        cd web-app
        npm ci
        license-checker --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;CC0-1.0;0BSD;MIT-0;BlueOak-1.0.0;CC-BY-4.0;(MIT OR CC0-1.0);MIT AND ISC' --excludePrivatePackages
        
    - name: Check backend licenses
      run: |
        cd services/patient-api
        npm ci
        license-checker --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;CC0-1.0;0BSD;MIT-0;BlueOak-1.0.0;CC-BY-4.0;(MIT OR CC0-1.0);MIT AND ISC' --excludePrivatePackages

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [security-scan, secret-scan, docker-security, codeql-analysis, license-check]
    if: always()
    
    steps:
    - name: Security Scan Summary
      run: |
        echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Dependency Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Secret Detection | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Docker Security | ${{ needs.docker-security.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| CodeQL Analysis | ${{ needs.codeql-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| License Check | ${{ needs.license-check.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Security Recommendations" >> $GITHUB_STEP_SUMMARY
        echo "- Review any failed security checks above" >> $GITHUB_STEP_SUMMARY
        echo "- Update dependencies with known vulnerabilities" >> $GITHUB_STEP_SUMMARY
        echo "- Ensure no secrets are committed to the repository" >> $GITHUB_STEP_SUMMARY
        echo "- Verify all Docker images are secure" >> $GITHUB_STEP_SUMMARY
