name: Release MediMesh

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [services/patient-api, web-app]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.workspace }}
      - run: npm test
        working-directory: ${{ matrix.workspace }}
      - run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.workspace }}

  validate-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp deployment/.env.example deployment/.env
      - run: sed -i 's/clinic.example.org/ci.example.test/g' deployment/.env
      - run: sh deployment/scripts/generate-secrets.sh
      - run: docker compose --env-file deployment/.env -f deployment/compose.prod.yml config --quiet

  container-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: api
            context: services/patient-api
          - component: web
            context: web-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t medimesh-release-scan:${{ matrix.component }} ${{ matrix.context }}
      - name: Block high and critical container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: medimesh-release-scan:${{ matrix.component }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

  publish:
    needs: [test, validate-deployment, container-scan]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: api
            context: services/patient-api
          - component: web
            context: web-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          build-args: |
            VITE_IDENTITY_MODE=local
            VITE_SHOW_DEMO_LOGIN=false
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
