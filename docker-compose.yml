services:
  postgres:
    image: postgres:15.8-alpine@sha256:8b963ea3038c3b32182ee7f592ccde21242fa7c5fd9d1b72aa333c27f1bfc809
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    secrets:
      - db_admin_password
      - app_db_password
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medimesh"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    secrets:
      - redis_password
    networks:
      - cache
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    volumes:
      - minio_data:/data
    expose:
      - "9000"
    secrets:
      - minio_root_user
      - minio_root_password
    networks:
      - storage
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$(cat /run/secrets/minio_root_user)" "$$(cat /run/secrets/minio_root_password)"
        mc mb --ignore-existing local/medimesh-medical-records local/medimesh-patient-documents local/medimesh-system-files
        mc admin user add local "$$(cat /run/secrets/minio_app_user)" "$$(cat /run/secrets/minio_app_password)" || true
        mc admin policy create local medimesh-files /config/minio-app-policy.json || true
        mc admin policy attach local medimesh-files --user "$$(cat /run/secrets/minio_app_user)"
    volumes:
      - ./security/minio-app-policy.json:/config/minio-app-policy.json:ro
    secrets:
      - minio_root_user
      - minio_root_password
      - minio_app_user
      - minio_app_password
    networks:
      - storage
    depends_on:
      minio:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    restart: "no"

  clamav:
    image: clamav/clamav:1.4@sha256:e7ead98e7e07231b151bce988e0cfb0a3b46e6e7046d9dd44fd838c0df724a03
    expose:
      - "3310"
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - scanning
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc 127.0.0.1 3310 | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1536m
    cpus: 1.0
    restart: unless-stopped

  patient-api:
    build:
      context: ./services/patient-api
      dockerfile: Dockerfile
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: medimesh
      DATABASE_USER: medimesh_user
      DATABASE_PASSWORD_FILE: /run/secrets/app_db_password
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      MFA_ENCRYPTION_KEY_FILE: /run/secrets/mfa_encryption_key
      FILE_ENCRYPTION_KEY_FILE: /run/secrets/file_encryption_key
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_app_user
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_app_password
      MPESA_CALLBACK_TOKEN_FILE: /run/secrets/mpesa_callback_token
      MPESA_ENVIRONMENT: ${MPESA_ENVIRONMENT:-sandbox}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-174379}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-}
      NODE_ENV: ${NODE_ENV:-development}
      REQUIRE_MFA: ${REQUIRE_MFA:-false}
      SESSION_TTL_SECONDS: 900
      AUDIT_FAIL_CLOSED: "true"
      DLP_EXPORT_LIMIT: 20
      PORT: 3000
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost
      LOG_LEVEL: info
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      RUN_RUNTIME_SCHEMA_SYNC: "false"
    expose:
      - "3000"
    secrets:
      - app_db_password
      - redis_password
      - jwt_secret
      - mfa_encryption_key
      - file_encryption_key
      - bootstrap_admin_password
      - minio_app_user
      - minio_app_password
      - mpesa_callback_token
    networks:
      - application
      - database
      - cache
      - storage
      - scanning
      - egress
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 200
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped

  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ""
        REACT_APP_IDENTITY_MODE: "local"
        REACT_APP_SHOW_DEMO_LOGIN: "false"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:8080"
    networks:
      - edge
      - application
    depends_on:
      patient-api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

networks:
  edge:
  application:
    internal: true
  database:
    internal: true
  cache:
    internal: true
  storage:
    internal: true
  scanning:
    internal: true
  egress:

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:

secrets:
  db_admin_password:
    file: ./secrets/db_admin_password.txt
  app_db_password:
    file: ./secrets/app_db_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  mfa_encryption_key:
    file: ./secrets/mfa_encryption_key.txt
  file_encryption_key:
    file: ./secrets/file_encryption_key.txt
  bootstrap_admin_password:
    file: ./secrets/bootstrap_admin_password.txt
  minio_root_user:
    file: ./secrets/minio_root_user.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt
  minio_app_user:
    file: ./secrets/minio_app_user.txt
  minio_app_password:
    file: ./secrets/minio_app_password.txt
  mpesa_callback_token:
    file: ./secrets/mpesa_callback_token.txt
